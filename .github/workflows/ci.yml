# CI of the Pokus Platform. Every job calls make targets of platform/; the
# local gate runs the same checks (and also lists the open verification
# markers). The job "required" stands for every blocking job, so branch
# protection requires that one job only.
#
# The repository is checked out to pokus-platform/, and pokus-infrastructure
# (for the contract and build jobs) next to it, at the commit of INFRA_PIN.
# Every third-party action is pinned to a full commit SHA.
#
# No expression is written into a run script: a value of the event reaches a
# step only through env:. The privacy and commit checks read the branch
# (GITHUB_REF_NAME) and the push's before and after (the event file)
# themselves, check them and give them to git as arguments, never to make or
# a shell. Their range: on a branch other than main, and in a manual run on
# any branch, every commit not on main yet (origin/main..after); on a push
# to main, the push's before..after (the whole history when before is the
# zero hash). The privacy scan always reads the whole work tree.
#
# The Python of every job is the version in BUILD_PYTHON, which make setup
# installs with uv; the workflow names no version of its own.
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The integration tests' database is the lab's PostgreSQL: the image,
    # tag and digest of pokus-infrastructure's docs/reference/versions.md at
    # INFRA_PIN (the contract job compares them), on the runner's loopback.
    # The tests require its major version and may not skip (ci/ci-skips.json).
    # Some tests compare with pokus-infrastructure's files at INFRA_PIN (its
    # restricted-schema check and its role names), checked out next to it.
    services:
      postgres:
        image: docker.io/library/postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: potka-ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    env:
      POTKA_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=potka-ci
      POTKA_POSTGRES_REQUIRED: "18"
      POTKA_INFRA: ../../pokus-infrastructure
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pokus-infrastructure
          ref: main
          fetch-depth: 0
          path: pokus-infrastructure
          persist-credentials: false
      - name: Check out pokus-infrastructure at INFRA_PIN
        run: git -C ../../pokus-infrastructure checkout --quiet --detach "$(cat ../INFRA_PIN)"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup test

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup generated

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pokus-infrastructure
          ref: main
          fetch-depth: 0
          path: pokus-infrastructure
          persist-credentials: false
      - name: Check out pokus-infrastructure at INFRA_PIN
        run: git -C ../../pokus-infrastructure checkout --quiet --detach "$(cat ../INFRA_PIN)"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup contract INFRA=../../pokus-infrastructure

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/pokus-infrastructure
          ref: main
          fetch-depth: 0
          path: pokus-infrastructure
          persist-credentials: false
      - name: Check out pokus-infrastructure at INFRA_PIN
        run: git -C ../../pokus-infrastructure checkout --quiet --detach "$(cat ../INFRA_PIN)"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup build INFRA=../../pokus-infrastructure

  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          fetch-depth: 0  # every branch, origin/main among them, with full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup
      - name: Scan
        env:
          # The maintainer's denylist, for this step only; without it the
          # scan passes with a warning.
          POTKA_PRIVACY_DENYLIST: ${{ secrets.POTKA_PRIVACY_DENYLIST }}
        run: make privacy

  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          fetch-depth: 0  # every commit message
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup references

  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pokus-platform/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pokus-platform
          fetch-depth: 0  # every branch, origin/main among them, with full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"
          enable-cache: false
      - run: make setup commits

  required:
    if: always()
    needs: [lint, test, generated, contract, build, privacy, references, commits]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every blocking job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a blocking job ended with: $result"
              exit 1
            fi
          done
          echo "every blocking job passed"
