# The Pokus Platform's uv workspace: one package per service in packages/.
# The release is built from uv.lock with the "build" group's backend; the
# "dev" and "contract" groups are for development and CI only.

[tool.uv]
required-version = ">=0.12.23,<0.13"
# A dependency version is locked only when it has been on PyPI for at least
# 7 days: uv leaves out every file uploaded later (the lock records the span).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
potka-core = { workspace = true }
potka-db = { workspace = true }

[dependency-groups]
build = ["uv_build==0.12.24"]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "actionlint-py==1.7.12.25",
  "shellcheck-py==0.11.0.1",
  "types-pyyaml==6.0.12.20260906",
  "types-jsonschema==4.26.0.20260518",
  "hypothesis==6.170.14",
  "psycopg[binary]==3.3.8",
]
contract = [
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "D", "G"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../ci:tests"

[tool.pytest.ini_options]
testpaths = ["tests", "../ci/tests"]
pythonpath = ["../ci", "tests"]
# skip_policy names every skipped test; in CI a skip that ci/ci-skips.json
# does not name fails.
addopts = ["-ra", "--strict-markers", "-p", "potka_ci.skip_policy", "-p", "potka_testing.fixtures"]
xfail_strict = true
