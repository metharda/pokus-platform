[project]
name = "potka-core"
version = "0.0.0"
description = "The shared core of the Pokus Platform's services."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "pydantic==2.14.2",
  "python-ulid==4.1.0",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "rfc8785==0.1.4",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
