[project]
name = "potka-cli"
version = "0.0.0"
description = "The command line of the Pokus Platform."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = ["potka-core"]

[project.scripts]
potka = "potka_cli.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
