[project]
name = "potka-gateway"
version = "0.0.0"
description = "The LLM gateway of the Pokus Platform (not implemented yet)."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = ["potka-core"]

[project.scripts]
potka-gw = "potka_gateway.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
