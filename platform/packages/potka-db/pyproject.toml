[project]
name = "potka-db"
version = "0.0.0"
description = "The Pokus Platform's database: tables, migrations and repositories."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.20.1",
  "potka-core",
  "psycopg[binary]==3.3.8",
  "sqlalchemy==2.1.8",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
