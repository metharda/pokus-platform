[project]
name = "potka-agent"
version = "0.0.0"
description = "The agent runner of the Pokus Platform (not implemented yet)."
license = "Apache-2.0"
requires-python = "==3.12.*"
# The agent's own package: it depends on no other package of this
# repository, and only on packages from an https:// index.
dependencies = []

[project.scripts]
potka-agent = "potka_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
